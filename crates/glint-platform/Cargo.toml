[package]
name = "glint-platform"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
log = "0.4"
anyhow.workspace = true
crossbeam-channel.workspace = true
glint-core.workspace = true
regex = "1"

[target.'cfg(windows)'.dependencies]
tiny-skia = { version = "0.11.4", default-features = false, features = ["std", "simd"] }
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging", "Win32_UI_Input_KeyboardAndMouse", "Win32_Graphics_Gdi", "Win32_System_LibraryLoader", "Win32_System_Threading", "Win32_UI_HiDpi", "Win32_UI_Shell", "Win32_System_Diagnostics_ToolHelp", "Win32_Security", "Win32_System_Registry", "Win32_UI_Accessibility", "Win32_UI_Controls"] }
