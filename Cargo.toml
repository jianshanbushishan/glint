[workspace]
members = ["crates/glint-core", "crates/glint-platform", "crates/glint-ipc", "crates/glint", "crates/glint-settings"]
resolver = "2"

[workspace.package]
version = "0.2.0"
edition = "2024"
license = "MIT"
rust-version = "1.88"

[workspace.dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
crossbeam-channel = "0.5"
glint-core = { path = "crates/glint-core" }
glint-platform = { path = "crates/glint-platform" }
glint-ipc = { path = "crates/glint-ipc" }

[profile.dev]
debug = 0

[profile.release]
# Prioritize runtime optimization over release build speed.
opt-level = 3
lto = "fat"
codegen-units = 1
incremental = false
strip = "debuginfo"
